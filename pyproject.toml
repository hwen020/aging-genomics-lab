[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aging-genomics-lab"
version = "0.3.1"
description = "Reproducible age-association analysis of public expression and methylation studies"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Research Software Portfolio" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "plotly>=5.20,<7",
  "streamlit>=1.36,<2",
  "xlrd>=2.0.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aginggenomics = ["portfolio_studies.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
